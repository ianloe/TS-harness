[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ts-harness"
version = "0.1.0"
description = "Personal automation and work harness with strict guardrails, policy engine, and cost controls."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.111.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "sqlalchemy>=2.0.30",
    "structlog>=24.1.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
ts-harness = "ts_harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ts_harness"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["ts_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ts_harness --cov-report=term-missing"
